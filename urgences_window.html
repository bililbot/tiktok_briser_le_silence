<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URGENCES_VSS_TIKTOK</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0d0e12;
            color: #f1f5f9;
            font-family: 'Space Grotesk', sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            border: 3px solid #7c3aed;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .emerg-header {
            background: linear-gradient(90deg, #2e1065, #1e1b4b);
            border: 1px solid rgba(167, 139, 250, 0.45);
            border-radius: 6px;
            padding: 6px 10px;
            font-family: 'Anton', sans-serif;
            font-size: 1.02rem;
            letter-spacing: 1px;
            color: #e2e8f0;
            text-align: center;
            text-transform: uppercase;
            text-shadow: 1px 1px 2px #000;
        }
        .emerg-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            gap: 5px;
        }
        .emerg-row {
            background: rgba(20, 22, 30, 0.96);
            border: 1px solid rgba(139, 92, 246, 0.4);
            border-left: 5px solid #8b5cf6;
            border-radius: 6px;
            padding: 6px 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.25s ease;
        }
        .emerg-row.zoom-focus {
            background: linear-gradient(90deg, #3b0764, #1e1b4b);
            border-color: #a78bfa;
            transform: scale(1.015);
            box-shadow: 0 0 12px rgba(139, 92, 246, 0.4);
        }
        .emerg-num {
            background: #4c1d95;
            border: 1px solid #a78bfa;
            color: #ffffff;
            font-family: 'Anton', Impact, sans-serif;
            font-size: 1.3rem;
            padding: 2px 10px;
            border-radius: 5px;
            letter-spacing: 1px;
            flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.6);
        }
        .emerg-lbl {
            font-size: 0.92rem;
            font-weight: 700;
            color: #e2e8f0;
            text-shadow: 1px 1px 2px #000;
            line-height: 1.15;
        }
    </style>
</head>
<body>
    <div class="emerg-header" id="emergTitle">📞 NUMÉROS D'AIDE & D'ÉCOUTE (GRATUITS & ANONYMES)</div>
    <div class="emerg-list" id="emergList"></div>

    <script>
        let focusIdx = 0;
        let lastJson = "";
        let currentStyle = "grille";
        let activeCount = 0;

        setInterval(() => {
            if (currentStyle === "zoom" && activeCount > 0) {
                focusIdx = (focusIdx + 1) % activeCount;
                document.querySelectorAll(".emerg-row").forEach((el, i) => {
                    el.classList.toggle("zoom-focus", i === focusIdx);
                });
            }
        }, 4000);

        let isPolling = false;
        async function poll() {
            if (isPolling) return;
            isPolling = true;
            const ctrl = new AbortController();
            const timerId = setTimeout(() => ctrl.abort(), 1200);
            try {
                const res = await fetch("http://127.0.0.1:8765/state?t=" + Date.now(), {
                    cache: "no-store",
                    signal: ctrl.signal
                });
                clearTimeout(timerId);
                if (!res.ok) return;
                const st = await res.json();
                document.getElementById("emergTitle").textContent = st.emergency_title || "📞 NUMÉROS D'AIDE & D'ÉCOUTE";
                currentStyle = st.emergency_style || "grille";
                const items = (st.emergency_numbers || []).filter(x => x.enabled);
                activeCount = items.length;
                const sig = JSON.stringify(items) + currentStyle + (st.emergency_scale_pct || 100);
                if (sig !== lastJson) {
                    lastJson = sig;
                    const scale = (st.emergency_scale_pct || 100) / 100.0;
                    const listEl = document.getElementById("emergList");
                    listEl.innerHTML = items.map((item, i) => `
                        <div class="emerg-row ${currentStyle === 'zoom' && i === (focusIdx % items.length) ? 'zoom-focus' : ''}">
                            <span class="emerg-num" style="font-size:${(1.3 * scale).toFixed(2)}rem;">📞 ${item.number}</span>
                            <span class="emerg-lbl" style="font-size:${(0.92 * scale).toFixed(2)}rem;">${item.label}</span>
                        </div>
                    `).join("");
                }
            } catch (e) {
            } finally {
                clearTimeout(timerId);
                isPolling = false;
            }
        }
        setInterval(poll, 350);
        poll();
    </script>
</body>
</html>
